# Windows portable of Orca Unificado (Snapmaker Orca 2.4.0 + M1 Orca Cloud).
# Same pipeline as Snapmaker v2.4.0: VS2022, cached deps, build_release_vs2022.bat.
# First run builds deps (~1-2 h) then the slicer. Later runs reuse Actions cache.
#
# Portable datadir: the zip ships `data_dir/` next to the exe.
# GUI_App::init_app_config already uses that folder (native Orca/SnOrca).
# Fallback: --datadir. Without the folder, Windows would use %APPDATA%\OrcaUnificado.
#
# Stacked feature branches (two-accounts UI, copy tweaks, …) must NOT be added
# to on.push.branches. This workflow stays workflow_dispatch-only everywhere
# except cursor/m1-orca-cloud-a90c, so a UI push cannot start or cancel the
# Windows portable build already running on that branch.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/m1-orca-cloud-a90c
    paths:
      - ".github/workflows/windows-build.yml"
