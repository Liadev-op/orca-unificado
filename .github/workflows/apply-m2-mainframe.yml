name: Apply M2 MainFrame models tab

# One-shot: MainFrame.cpp is 184KB, too large for GitHub MCP push_files.
# git-apply of a 2.8KB unified diff (byte-identical to local sha256 e48be142...).
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/m2-models-webview-59e1
    paths:
      - ".github/workflows/apply-m2-mainframe.yml"
      - ".github/patches/m2-mainframe-models.patch"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/m2-models-webview-59e1
      - name: Apply MainFrame models-tab patch
        run: |
          set -euo pipefail
          if grep -q "void MainFrame::ensure_models_tab()" src/slic3r/GUI/MainFrame.cpp; then
            echo already patched
            exit 0
          fi
          git apply --verbose .github/patches/m2-mainframe-models.patch
          python3 -c "import hashlib,pathlib; b=pathlib.Path('src/slic3r/GUI/MainFrame.cpp').read_bytes(); h=hashlib.sha256(b).hexdigest(); print(len(b), h); assert h=='e48be142c8da4b71e6be7e788c15e6d2e05f9f4a6456de8c6512281699fef242'"
          git config user.name "Liadev"
          git config user.email "122531419+Liadev-op@users.noreply.github.com"
          git add src/slic3r/GUI/MainFrame.cpp
          git commit -m "feat: wire Models tab in MainFrame, CMake, and m2-windows zip"
          git push origin HEAD:cursor/m2-models-webview-59e1
